name: Update INSPIRE Publications

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday at 06:00 UTC
  workflow_dispatch: {}    # allows manual runs from the Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit and push updated publication files

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch publications from INSPIRE-HEP
        run: python3 markdown_generator/inspirehep_publications.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _publications
          git commit -m "Automated update of INSPIRE-HEP publications" || echo "No changes to commit"
          git push
