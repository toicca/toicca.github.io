{% include base_path %}

<meta charset="utf-8">

<!-- Set data-theme before first paint to avoid a flash of the wrong theme.
     Mirrors the priority order in assets/js/_main.js's setTheme(): explicit
     localStorage override wins; otherwise fall back to OS/browser preference.
     Keep this logic in sync with _main.js if theme options ever change. -->
<script>
  (function () {
    try {
      var theme = localStorage.getItem('theme');
      if (theme !== 'dark' && theme !== 'light') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  })();
</script>

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
